services:
  # Backend API Service
  - type: web
    name: pgcollege-api
    runtime: node
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Add these in Render Dashboard:
      # - MONGO_URI
      # - JWT_SECRET
      # - JWT_REFRESH_SECRET
      # - EMAIL_HOST
      # - EMAIL_PORT
      # - EMAIL_USER
      # - EMAIL_PASSWORD
      # - GOOGLE_CLIENT_ID
      # - GOOGLE_CLIENT_SECRET
      # - CASHFREE_APP_ID
      # - CASHFREE_SECRET_KEY
      # - UPSTASH_REDIS_REST_URL
      # - UPSTASH_REDIS_REST_TOKEN
      # - CLIENT_URL
    healthCheckPath: /api/v1/health
